<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">6-Signal Hybrid Scoring Engine</title>
  <desc id="desc">Visualization of the HybridRetriever 6-signal weighted scoring from MemTier paper: semantic, lexical, graph, time decay, cognitive, and tier boost signals.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#F8FCFF"/><stop offset="100%" stop-color="#EEF5FF"/></linearGradient>
    <linearGradient id="tealAmber" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0EA5A0"/><stop offset="100%" stop-color="#F59E0B"/></linearGradient>
    <linearGradient id="tealFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0EA5A0" stop-opacity="0.15"/><stop offset="100%" stop-color="#0EA5A0" stop-opacity="0.03"/></linearGradient>
    <linearGradient id="amberFade" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#F59E0B" stop-opacity="0.15"/><stop offset="100%" stop-color="#F59E0B" stop-opacity="0.03"/></linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0B0F19" flood-opacity="0.14"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="3" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      .title{font:800 36px Inter,Segoe UI,Arial,sans-serif;fill:#0B0F19}
      .sub{font:600 18px Inter,Segoe UI,Arial,sans-serif;fill:#334155}
      .h{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#0B0F19}
      .h-teal{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#0EA5A0}
      .h-amber{font:800 18px Inter,Segoe UI,Arial,sans-serif;fill:#D97706}
      .p{font:600 14px Inter,Segoe UI,Arial,sans-serif;fill:#1E293B}
      .p-sm{font:600 12px Inter,Segoe UI,Arial,sans-serif;fill:#475569}
      .math{font:italic 700 16px 'Fira Code',monospace;fill:#0EA5A0}
      .weight{font:800 28px Inter,Segoe UI,Arial,sans-serif;fill:#0B0F19}
      .weight-label{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#64748B}
      .chip{font:800 12px Inter,Segoe UI,Arial,sans-serif;fill:#FFFFFF}
      .edge{stroke:url(#tealAmber);stroke-width:4;fill:none;stroke-linecap:round;stroke-dasharray:8 6;animation:dash 6s linear infinite}
      .panel-a{transform-box:fill-box;transform-origin:center;animation:floatA 6.2s ease-in-out infinite}
      .panel-b{transform-box:fill-box;transform-origin:center;animation:floatB 7.3s ease-in-out infinite}
      .panel-c{transform-box:fill-box;transform-origin:center;animation:floatC 8.1s ease-in-out infinite}
      .scan{opacity:0.25;animation:scanX 9s linear infinite}
      .pulse{animation:pulse 2.4s ease-in-out infinite}
      @keyframes dash{to{stroke-dashoffset:-160}}
      @keyframes floatA{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
      @keyframes floatB{0%,100%{transform:translateY(0)}50%{transform:translateY(4px)}}
      @keyframes floatC{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
      @keyframes scanX{0%{transform:translateX(-260px)}100%{transform:translateX(1700px)}}
      @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
    </style>
    <marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#0EA5A0"/></marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect x="30" y="30" width="1540" height="840" rx="24" fill="#FFFFFF" stroke="#DDE7F7" filter="url(#softShadow)"/>
  <rect class="scan" x="-260" y="156" width="220" height="5" rx="3" fill="url(#tealAmber)"/>

  <text x="70" y="90" class="title">HybridRetriever — 6-Signal Weighted Scoring</text>
  <text x="70" y="120" class="sub">MemTier-inspired multi-signal fusion: S(q, m) = Σ wᵢ · φᵢ(q, m) across semantic, lexical, graph, decay, cognitive, and tier channels.</text>

  <!-- Formula bar -->
  <rect x="70" y="140" width="1460" height="36" rx="8" fill="#F0FDF9" stroke="#0EA5A044"/>
  <text x="90" y="164" class="math">S(q,m) = 0.20·φ_sem + 0.30·φ_bm25 + 0.15·φ_graph + 0.15·φ_decay + 0.10·φ_cw + 0.10·φ_tier</text>

  <!-- Signal 1: Semantic -->
  <g class="panel-a">
    <rect x="70" y="200" width="230" height="185" rx="16" fill="#ECFDFA" stroke="#0EA5A0"/>
    <rect x="70" y="200" width="230" height="40" rx="16" fill="#0EA5A0"/>
    <rect x="70" y="224" width="230" height="16" fill="#0EA5A0"/>
    <text x="105" y="226" class="chip">φ_sem — Semantic</text>
    <circle cx="87" cy="220" r="8" fill="#FFFFFF" opacity="0.3"/>
    <text x="90" y="268" class="weight">0.20</text>
    <text x="90" y="286" class="weight-label">weight</text>
    <text x="90" y="312" class="p">Dense vector cosine</text>
    <text x="90" y="332" class="p">similarity normalized</text>
    <text x="90" y="352" class="p">via min-max scaling</text>
    <text x="90" y="374" class="p-sm">Cohere embed-v4 / BGEM3</text>
  </g>

  <!-- Signal 2: Lexical -->
  <g class="panel-b">
    <rect x="320" y="200" width="230" height="185" rx="16" fill="#FFF7EB" stroke="#F59E0B"/>
    <rect x="320" y="200" width="230" height="40" rx="16" fill="#F59E0B"/>
    <rect x="320" y="224" width="230" height="16" fill="#F59E0B"/>
    <text x="355" y="226" class="chip">φ_bm25 — Lexical</text>
    <circle cx="337" cy="220" r="8" fill="#FFFFFF" opacity="0.3"/>
    <text x="340" y="268" class="weight">0.30</text>
    <text x="340" y="286" class="weight-label">weight (highest)</text>
    <text x="340" y="312" class="p">BM25 keyword scoring</text>
    <text x="340" y="332" class="p">with term frequency</text>
    <text x="340" y="352" class="p">normalization</text>
    <text x="340" y="374" class="p-sm">Pyserini / custom BM25</text>
  </g>

  <!-- Signal 3: Graph -->
  <g class="panel-c">
    <rect x="570" y="200" width="230" height="185" rx="16" fill="#F5FAFF" stroke="#BFD0EE"/>
    <rect x="570" y="200" width="230" height="40" rx="16" fill="#3B82F6"/>
    <rect x="570" y="224" width="230" height="16" fill="#3B82F6"/>
    <text x="605" y="226" class="chip">φ_graph — Graph</text>
    <circle cx="587" cy="220" r="8" fill="#FFFFFF" opacity="0.3"/>
    <text x="590" y="268" class="weight">0.15</text>
    <text x="590" y="286" class="weight-label">weight</text>
    <text x="590" y="312" class="p">Personalized PageRank</text>
    <text x="590" y="332" class="p">over entity-relation</text>
    <text x="590" y="352" class="p">neighborhood in Neo4j</text>
    <text x="590" y="374" class="p-sm">3-tier: episode/fact/community</text>
  </g>

  <!-- Signal 4: Time Decay -->
  <g class="panel-a">
    <rect x="820" y="200" width="230" height="185" rx="16" fill="#ECFDFA" stroke="#0EA5A0"/>
    <rect x="820" y="200" width="230" height="40" rx="16" fill="#0EA5A0"/>
    <rect x="820" y="224" width="230" height="16" fill="#0EA5A0"/>
    <text x="855" y="226" class="chip">φ_decay — Time Decay</text>
    <circle cx="837" cy="220" r="8" fill="#FFFFFF" opacity="0.3"/>
    <text x="840" y="268" class="weight">0.15</text>
    <text x="840" y="286" class="weight-label">weight</text>
    <text x="840" y="312" class="p">exp(-λ · days_old)</text>
    <text x="840" y="332" class="p">with BM25 bypass for</text>
    <text x="840" y="352" class="p">high-scoring lexical hits</text>
    <text x="840" y="374" class="p-sm">λ=0.05, bypass ≥ 2.0</text>
  </g>

  <!-- Signal 5: Cognitive -->
  <g class="panel-b">
    <rect x="1070" y="200" width="230" height="185" rx="16" fill="#FFF7EB" stroke="#F59E0B"/>
    <rect x="1070" y="200" width="230" height="40" rx="16" fill="#F59E0B"/>
    <rect x="1070" y="224" width="230" height="16" fill="#F59E0B"/>
    <text x="1105" y="226" class="chip">φ_cw — Cognitive</text>
    <circle cx="1087" cy="220" r="8" fill="#FFFFFF" opacity="0.3"/>
    <text x="1090" y="268" class="weight">0.10</text>
    <text x="1090" y="286" class="weight-label">weight</text>
    <text x="1090" y="312" class="p">0.6 × salience +</text>
    <text x="1090" y="332" class="p">0.4 × FSRS strength</text>
    <text x="1090" y="352" class="p">(normalized)</text>
    <text x="1090" y="374" class="p-sm">Emotional + spaced rep.</text>
  </g>

  <!-- Signal 6: Tier Boost -->
  <g class="panel-c">
    <rect x="1320" y="200" width="210" height="185" rx="16" fill="#F5FAFF" stroke="#BFD0EE"/>
    <rect x="1320" y="200" width="210" height="40" rx="16" fill="#6366F1"/>
    <rect x="1320" y="224" width="210" height="16" fill="#6366F1"/>
    <text x="1355" y="226" class="chip">φ_tier — Tier Boost</text>
    <circle cx="1337" cy="220" r="8" fill="#FFFFFF" opacity="0.3"/>
    <text x="1340" y="268" class="weight">0.10</text>
    <text x="1340" y="286" class="weight-label">weight</text>
    <text x="1340" y="312" class="p">Short: 1.0× base</text>
    <text x="1340" y="332" class="p">Mid: 1.2× boost</text>
    <text x="1340" y="352" class="p">Long: 1.4× boost</text>
    <text x="1340" y="374" class="p-sm">MemTier tiered retrieval</text>
  </g>

  <!-- Fusion section -->
  <rect x="70" y="410" width="1460" height="4" rx="2" fill="url(#tealAmber)" opacity="0.3"/>

  <!-- Normalizer -->
  <g class="panel-a">
    <rect x="70" y="435" width="340" height="170" rx="16" fill="#F0FDF9" stroke="#0EA5A066"/>
    <text x="90" y="467" class="h-teal">_Normalizer</text>
    <text x="90" y="493" class="p">• Tracks running min / max per signal</text>
    <text x="90" y="513" class="p">• Min-max normalization → [0, 1] range</text>
    <text x="90" y="533" class="p">• Handles degenerate case (max = min)</text>
    <text x="90" y="553" class="p">• Stateful across query batch</text>
    <text x="90" y="580" class="p-sm">Ensures all 6 signals are commensurable before weighting</text>
  </g>

  <!-- HitAccumulator -->
  <g class="panel-b">
    <rect x="440" y="435" width="340" height="170" rx="16" fill="#FFFBF0" stroke="#F59E0B66"/>
    <text x="460" y="467" class="h-amber">_HitAccumulator</text>
    <text x="460" y="493" class="p">• Deduplicates by page_id</text>
    <text x="460" y="513" class="p">• Aggregates raw scores per signal</text>
    <text x="460" y="533" class="p">• Applies weighted sum after normalize</text>
    <text x="460" y="553" class="p">• Sorts by final combined score</text>
    <text x="460" y="580" class="p-sm">Union of all sub-retriever results into one ranked list</text>
  </g>

  <!-- Entry Resolution -->
  <g class="panel-c">
    <rect x="810" y="435" width="340" height="170" rx="16" fill="#F5FAFF" stroke="#BFD0EE"/>
    <text x="830" y="467" class="h">_resolve_entry()</text>
    <text x="830" y="493" class="p">• Hit → page_store.get(page_id)</text>
    <text x="830" y="513" class="p">• page.meta → memory_id lookup</text>
    <text x="830" y="533" class="p">• memory_store.get_entry_by_id()</text>
    <text x="830" y="553" class="p">• Returns MemoryEntry with tier/FSRS</text>
    <text x="830" y="580" class="p-sm">Bridges page-level retrieval to memory-level cognition</text>
  </g>

  <!-- Output -->
  <g class="panel-a">
    <rect x="1180" y="435" width="350" height="170" rx="16" fill="#ECFDFA" stroke="#0EA5A0"/>
    <text x="1200" y="467" class="h-teal">Ranked Output</text>
    <text x="1200" y="493" class="p">• top_k results by combined score</text>
    <text x="1200" y="513" class="p">• Each hit carries all 6 sub-scores</text>
    <text x="1200" y="533" class="p">• meta dict with full provenance</text>
    <text x="1200" y="553" class="p">• Feeds AdaptiveContextManager</text>
    <text x="1200" y="580" class="p-sm">List[List[Hit]] — AbsRetriever interface compatible</text>
  </g>

  <!-- Flow arrows -->
  <path class="edge" d="M300,393 L300,435" marker-end="url(#arr)"/>
  <path class="edge" d="M550,393 L550,435" marker-end="url(#arr)"/>
  <path class="edge" d="M800,393 L800,435" marker-end="url(#arr)"/>
  <path class="edge" d="M1050,393 L1050,435" marker-end="url(#arr)"/>
  <path class="edge" d="M1300,393 L1300,435" marker-end="url(#arr)"/>

  <!-- Bottom data flow -->
  <rect x="70" y="630" width="1460" height="4" rx="2" fill="url(#tealAmber)" opacity="0.3"/>

  <g class="panel-b">
    <rect x="70" y="658" width="470" height="180" rx="16" fill="#F5FAFF" stroke="#BFD0EE"/>
    <text x="90" y="690" class="h">Data Flow</text>
    <text x="90" y="718" class="p">1. Query arrives → fan out to all sub-retrievers</text>
    <text x="90" y="738" class="p">2. Each retriever returns List[Hit] with raw scores</text>
    <text x="90" y="758" class="p">3. _HitAccumulator merges, _Normalizer scales [0,1]</text>
    <text x="90" y="778" class="p">4. _resolve_entry() fetches MemoryEntry for decay/cw/tier</text>
    <text x="90" y="798" class="p">5. Weighted sum → sort → top_k output</text>
    <text x="90" y="822" class="p-sm">Full pipeline runs in a single search() call, AbsRetriever-compatible</text>
  </g>

  <g class="panel-c">
    <rect x="570" y="658" width="470" height="180" rx="16" fill="#FFFBF0" stroke="#F59E0B66"/>
    <text x="590" y="690" class="h">Key Design Decisions</text>
    <text x="590" y="718" class="p">• BM25 gets highest weight (0.30) — lexical precision matters</text>
    <text x="590" y="738" class="p">• Time decay has BM25 bypass — fresh exact matches survive</text>
    <text x="590" y="758" class="p">• Cognitive signal blends affect + spaced repetition</text>
    <text x="590" y="778" class="p">• Tier boost rewards consolidated long-term memories</text>
    <text x="590" y="798" class="p">• All weights configurable via HybridRetrieverConfig</text>
    <text x="590" y="822" class="p-sm">Inspired by MemTier (arXiv:2605.03675) multi-signal retrieval</text>
  </g>

  <g class="panel-a">
    <rect x="1070" y="658" width="460" height="180" rx="16" fill="#ECFDFA" stroke="#0EA5A0"/>
    <text x="1090" y="690" class="h-teal">Integration Points</text>
    <text x="1090" y="718" class="p">• Wraps: IndexRetriever, BM25, Dense, Graph</text>
    <text x="1090" y="738" class="p">• Consumes: AdvancedMemoryStore entries</text>
    <text x="1090" y="758" class="p">• Feeds: AdaptiveContextManager.pack()</text>
    <text x="1090" y="778" class="p">• Used by: ResearchAgent for evidence retrieval</text>
    <text x="1090" y="798" class="p">• Config: mnemos.config.HybridRetrieverConfig</text>
    <text x="1090" y="822" class="p-sm">Drop-in replacement wherever AbsRetriever is expected</text>
  </g>
</svg>