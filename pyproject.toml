[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mnemos"
version = "0.1.0"
description = "Temporal Memory Infrastructure for Autonomous AI"
readme = "README.md"
authors = [
  { name = "Dev Chiniwala" },
]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "pydantic>=2.0",
    "openai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1",
]
graph = [
    "neo4j>=5.0",
]

[tool.hatch.build.targets.wheel]
packages = ["mnemos"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "C", "B"]
ignore = ["B008"]

[tool.mypy]
strict = true
ignore_missing_imports = true
